name: Crossref Astronomy & Astrophysics manual
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: crossref-api-requests
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record starting revision
        run: echo "START_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check collector invariants without API requests
        run: python -m unittest discover -s tests -v
      - name: Capture last 30 publication days through yesterday UTC
        env:
          CROSSREF_MAILTO: ${{ secrets.CROSSREF_MAILTO }}
        run: python -u scripts/collect_crossref_aanda.py --mode crossref --max-requests 100
      - name: Preserve capture as artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: crossref-aanda-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            library/crossref/aanda.sqlite
          if-no-files-found: ignore
      - name: Publish saved data
        if: always()
        run: |
          if [ ! -f library/crossref/aanda.sqlite ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- library/crossref/aanda.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update A&A crossref manual capture'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$START_REV" origin/main -- library/crossref/aanda.sqlite; then
              echo 'Remote aanda data changed; retain artifact instead of overwriting it.' >&2
              exit 1
            fi
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
