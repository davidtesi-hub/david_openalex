name: 0 The Astrophysical Journal OA
on:
  schedule:
    # Every four hours, UTC; phase starts at 03:00.
    - cron: '0 3,7,11,15,19,23 * * *'
  workflow_dispatch:
    inputs:
      max_intervals:
        description: Maximum date intervals
        default: '2'
        required: true
      max_requests:
        description: Maximum HTTP attempts including retries
        default: '100'
        required: true
      from_date:
        description: Optional first publication date YYYY-MM-DD
        required: false
      to_date:
        description: Optional last publication date YYYY-MM-DD
        required: false
permissions:
  contents: write
concurrency:
  group: openalex-collectors
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Record starting revision
        run: echo "START_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check collector invariants without API requests
        run: python -m unittest discover -s tests -v
      - name: Collect journal metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MAX_INTERVALS: ${{ inputs.max_intervals || '2' }}
          MAX_REQUESTS: ${{ inputs.max_requests || '100' }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          args=(--journal apj --max-intervals "$MAX_INTERVALS" --max-requests "$MAX_REQUESTS")
          if [ -n "$FROM_DATE" ]; then args+=(--from-date "$FROM_DATE"); fi
          if [ -n "$TO_DATE" ]; then args+=(--to-date "$TO_DATE"); fi
          python scripts/collect_openalex_journal.py "${args[@]}"
      - name: Publish saved data
        if: always()
        run: |
          if [ ! -f library/apj.sqlite ] || [ ! -f library/apj.coverage.sqlite ]; then exit 0; fi
          python scripts/library_storage.py pack library/apj.sqlite
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- library/apj.sqlite.zlib library/apj.coverage.sqlite
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update apj library and coverage'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$START_REV" origin/main -- library/apj.sqlite.zlib library/apj.coverage.sqlite; then
              echo 'Remote apj data changed; refusing to overwrite it.' >&2
              exit 1
            fi
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
