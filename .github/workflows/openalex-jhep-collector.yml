name: "Journal of High Energy Physics collector"
on:
  schedule:
    # Every four hours, UTC; phase starts at 04:10.
    - cron: '10 0,4,8,12,16,20 * * *'
  workflow_dispatch:
    inputs:
      max_intervals:
        description: Maximum date intervals
        default: '2'
        required: true
      max_requests:
        description: Maximum HTTP attempts including retries
        default: '100'
        required: true
      from_date:
        description: Optional first publication date YYYY-MM-DD
        required: false
      to_date:
        description: Optional last publication date YYYY-MM-DD
        required: false
permissions:
  contents: write
concurrency:
  group: openalex-collectors
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record starting revision
        run: echo "START_REV=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Check collector invariants without API requests
        run: python -m unittest discover -s tests -v
      - name: Collect journal metadata
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          MAX_INTERVALS: ${{ inputs.max_intervals || '2' }}
          MAX_REQUESTS: ${{ inputs.max_requests || '100' }}
          FROM_DATE: ${{ inputs.from_date }}
          TO_DATE: ${{ inputs.to_date }}
        run: |
          args=(--journal jhep --max-intervals "$MAX_INTERVALS" --max-requests "$MAX_REQUESTS")
          if [ -n "$FROM_DATE" ]; then args+=(--from-date "$FROM_DATE"); fi
          if [ -n "$TO_DATE" ]; then args+=(--to-date "$TO_DATE"); fi
          python scripts/collect_openalex_journal.py "${args[@]}"
      - name: Preserve SQLite and coverage as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jhep-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            library/jhep.sqlite
            library/jhep.coverage.json
          if-no-files-found: ignore
      - name: Publish saved data
        if: always()
        run: |
          if [ ! -f library/jhep.sqlite ] || [ ! -f library/jhep.coverage.json ]; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- library/jhep.sqlite library/jhep.coverage.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update jhep library and coverage'
          for attempt in 1 2 3; do
            git fetch origin main
            if ! git diff --quiet "$START_REV" origin/main -- library/jhep.sqlite library/jhep.coverage.json; then
              echo 'Remote jhep data changed; retain artifact instead of overwriting it.' >&2
              exit 1
            fi
            git rebase origin/main || { git rebase --abort; exit 1; }
            if git push origin HEAD:main; then exit 0; fi
            sleep "$attempt"
          done
          exit 1
