<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>OpenAlex · Evolución de papers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#edf7ec;color:#17212e;font:15px/1.4 system-ui,"Segoe UI",sans-serif}main{width:min(1450px,100%);margin:auto;padding:20px}h1{margin:0;font-size:clamp(1.5rem,4vw,2.2rem)}.muted{color:#526176}nav{display:flex;gap:7px;overflow:auto;padding:15px 0}button{border:1px solid #cbd5e1;background:white;border-radius:20px;padding:8px 13px;white-space:nowrap;cursor:pointer}button[aria-pressed=true]{background:#1d4ed8;color:white}.kpis{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px}.kpi,.card{background:#fff;border:1px solid #d7e1dd;border-radius:12px;padding:14px;box-shadow:0 2px 8px #1023180b}.kpi strong{display:block;font-size:clamp(1.2rem,2.4vw,2rem);font-variant-numeric:tabular-nums}.kpi span{font-size:.82rem;color:#526176}.legend{display:flex;flex-wrap:wrap;gap:7px 14px;margin:17px 0}.legend span{font-size:.75rem;display:flex;align-items:center;gap:5px}.legend i{display:inline-block;width:12px;height:12px;border-radius:2px}.charts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card.wide{grid-column:1/-1}.card h2{margin:0;font-size:1.12rem}.head{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.head .stats{text-align:right;font-weight:650}.head .stats small{display:block;color:#526176;font-weight:400}svg{display:block;width:100%;height:300px;overflow:visible}.wide svg{height:320px}.scroll{overflow-x:auto}.axis{fill:#526176;font-size:11px}.grid{stroke:#dbe3e7}.value{font-size:10px;font-weight:700}.footer{color:#526176;font-size:.8rem;margin:15px 0}.hint{font-size:.8rem;color:#526176;margin:5px 0 0}@media(max-width:900px){.kpis{grid-template-columns:repeat(3,1fr)}.charts{grid-template-columns:1fr}.card.wide{grid-column:auto}}@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}main{padding:12px}.card{padding:10px}svg{min-width:500px}.wide svg{min-width:700px}}
</style></head>
<body><main>
<header><h1>Papers de OpenAlex</h1><div class="muted">Fecha efectiva: published-online de Crossref; si falta, publication_date de OpenAlex · UTC</div></header>
<nav id="tabs" aria-label="Journal"></nav>
<section class="kpis" id="kpis"></section>
<div class="legend" id="legend"></div>
<div class="charts" id="charts"></div>
<p class="footer" id="updated"></p>
</main><script>
const stages=[
 ['collected','Sin fase 1','#8B5E3C'],
 ['p1_discarded','Descartados fase 1','#C62828'],
 ['p1_stopped','Fase 1: no pasan','#E67E22'],
 ['p1_pending','Fase 1: pendientes','#F8C471'],
 ['p2_discarded','Descartados fase 2','#1B5E20'],
 ['p2_stopped','Fase 2: no pasan','#388E3C'],
 ['p2_pending','Fase 2: pendientes','#81C784'],
 ['p3_discarded','Descartados fase 3','#0D47A1'],
 ['p3_stopped','Fase 3: no pasan','#1976D2'],
 ['p3_pending','Fase 3: pendientes','#90CAF9'],
 ['phase4','Llegaron a fase 4','#7B1FA2']
];
const fmt=new Intl.NumberFormat('es-ES');let data,selected='Total';
const total=v=>Object.values(v).reduce((a,b)=>a+b,0);
const coverage=(started,n)=>n?Math.round(started*100/n):0;
const svgEl=(name,attrs)=>{const e=document.createElementNS('http://www.w3.org/2000/svg',name);for(const [k,v] of Object.entries(attrs))e.setAttribute(k,v);return e};
function draw(svg,labels,values){const n=values.length,W=Math.max(650,n*65),H=300,L=48,R=15,T=32,B=57,ph=H-T-B;
 svg.replaceChildren();svg.setAttribute('viewBox',`0 0 ${W} ${H}`);const max=Math.max(1,...values.map(total));const top=Math.ceil(max/4)*4;
 for(let i=0;i<=4;i++){const y=T+ph-i*ph/4;svg.append(svgEl('line',{x1:L,x2:W-R,y1:y,y2:y,class:'grid'}));const t=svgEl('text',{x:L-6,y:y+4,'text-anchor':'end',class:'axis'});t.textContent=fmt.format(Math.round(top*i/4));svg.append(t)}
 values.forEach((v,i)=>{const slot=(W-L-R)/n,bw=Math.min(45,slot*.66),x=L+i*slot+(slot-bw)/2;let y=T+ph;
  for(const [key,label,color] of stages){const amount=v[key]||0,h=amount/top*ph;if(h<=0)continue;y-=h;const rect=svgEl('rect',{x,y,width:bw,height:h,fill:color});const tip=svgEl('title',{});tip.textContent=`${labels[i]} · ${label}: ${fmt.format(amount)}`;rect.append(tip);svg.append(rect);
   if(h>=17){const text=svgEl('text',{x:x+bw/2,y:y+h/2+3,'text-anchor':'middle',class:'value',fill:(key==='p1_pending'||key==='p2_pending'||key==='p3_pending')?'#17212e':'white'});text.textContent=fmt.format(amount);svg.append(text)}
  }
  const t=svgEl('text',{x:x+bw/2,y:H-34,'text-anchor':'middle',class:'axis'});t.textContent=labels[i];svg.append(t);const num=svgEl('text',{x:x+bw/2,y:Math.max(12,y-5),'text-anchor':'middle',class:'value',fill:'#17212e'});num.textContent=fmt.format(total(v));svg.append(num)
 });}
function card(title,chart,wide=false,weekly=false){const el=document.createElement('article');el.className='card'+(wide?' wide':'');const n=chart.values.reduce((s,v)=>s+total(v),0),p1=chart.values.reduce((s,v)=>s+total(v)-(v.collected||0),0);el.innerHTML=`<div class="head"><h2>${title}</h2><div class="stats">Recolectados ${fmt.format(n)}<small>Cobertura fase 1: ${coverage(p1,n)}%</small></div></div><div class="scroll"><svg role="img" aria-label="${title}: distribución por fase"></svg></div><p class="hint">Cifras dentro de cada tramo cuando caben; coloca el cursor sobre la barra para ver todas.</p>`;draw(el.querySelector('svg'),chart.labels,chart.values);return el}
function render(){const d=selected==='Total'?data.Total:data.journals[selected],k=document.querySelector('#kpis');k.replaceChildren();const vals=[[`${coverage(d.started[0],d.total)}%`,'Cobertura fase 1'],[fmt.format(d.total),'Recolectados'],[fmt.format(d.started[0]),'Iniciaron fase 1'],[fmt.format(d.started[1]),'Iniciaron fase 2'],[fmt.format(d.started[2]),'Iniciaron fase 3'],[fmt.format(d.started[3]),'Llegaron a fase 4']];for(const [v,label] of vals){const box=document.createElement('div');box.className='kpi';box.innerHTML=`<strong>${v}</strong><span>${label}</span>`;k.append(box)}const charts=document.querySelector('#charts');charts.replaceChildren();for(const [title,key,wide] of [['Semana actual','current_week',false],['Semana anterior','previous_week',false],['Últimas 12 semanas','weeks',true],['Últimos 12 meses','months',true],['Últimos 8 trimestres','quarters',true],['Últimos 5 años','years',true]])charts.append(card(title,d.charts[key],wide,key.includes('week')))}
async function main(){try{const response=await fetch(`data/pipeline.json?t=${Date.now()}`,{cache:'no-store'});if(!response.ok)throw Error(`HTTP ${response.status}`);data=await response.json();const legend=document.querySelector('#legend');for(const [key,label,color] of stages){const item=document.createElement('span');item.innerHTML=`<i style="background:${color}"></i>${label}`;legend.append(item)}const tabs=document.querySelector('#tabs');for(const name of ['Total',...Object.keys(data.journals)]){const b=document.createElement('button');b.textContent=name;b.setAttribute('aria-pressed',name===selected);b.onclick=()=>{selected=name;for(const button of tabs.children)button.setAttribute('aria-pressed',button===b);render()};tabs.append(b)}document.querySelector('#updated').textContent=`Datos publicados: ${new Date(data.generated_at_utc).toLocaleString('es-ES',{timeZone:'UTC'})} UTC. Cada paper aparece en un solo tramo por gráfica.`;render()}catch(error){document.querySelector('#updated').textContent=`No se pudieron cargar los datos: ${error.message}`}}
main();
</script></body></html>
